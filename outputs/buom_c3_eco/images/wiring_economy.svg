<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52717a"/></marker></defs><rect width="1200" height="740" fill="#f5f8f8"/><text x="36" y="42" font-size="24" font-family="Arial" font-weight="bold" fill="#143e49">BUOM C3 ECO / POWER &amp; SIGNAL OVERVIEW</text><polyline points="235,150 340,150" fill="none" stroke="#b34f4f" stroke-width="3" marker-end="url(#arrow)"/><text x="255" y="130" font-family="Arial" font-size="14" fill="#b34f4f">VBAT</text><polyline points="555,150 810,150" fill="none" stroke="#b34f4f" stroke-width="3" marker-end="url(#arrow)"/><text x="615" y="130" font-family="Arial" font-size="14" fill="#b34f4f">VSERVO</text><polyline points="130,200 130,325" fill="none" stroke="#b34f4f" stroke-width="3" marker-end="url(#arrow)"/><text x="46" y="270" font-family="Arial" font-size="14" fill="#b34f4f">VBAT</text><polyline points="245,385 365,385" fill="none" stroke="#b56c27" stroke-width="3" marker-end="url(#arrow)"/><text x="265" y="365" font-family="Arial" font-size="14" fill="#b56c27">5V / SS14</text><polyline points="590,395 805,395" fill="none" stroke="#316b99" stroke-width="3" marker-end="url(#arrow)"/><text x="665" y="378" font-family="Arial" font-size="14" fill="#316b99">3.3V PWM</text><polyline points="975,325 975,210" fill="none" stroke="#316b99" stroke-width="3" marker-end="url(#arrow)"/><text x="965" y="270" font-family="Arial" font-size="14" fill="#316b99">5V PWM</text><polyline points="475,325 475,200" fill="none" stroke="#497a58" stroke-width="3" marker-end="url(#arrow)"/><text x="490" y="264" font-family="Arial" font-size="14" fill="#497a58">GPIO10 enable</text><rect x="35" y="95" width="200" height="105" rx="9" fill="white" stroke="#73929b" stroke-width="2"/><text x="49" y="121" font-family="Arial" font-size="18" font-weight="bold" fill="#143e49">2S LiPo</text><text x="49" y="148" font-family="Arial" font-size="14" fill="#2b505b">6.6-8.4 V | keyed plug</text><text x="49" y="170" font-family="Arial" font-size="14" fill="#2b505b">J1-1 VBAT</text><text x="49" y="192" font-family="Arial" font-size="14" fill="#2b505b">J1-2 GND</text><rect x="340" y="95" width="215" height="105" rx="9" fill="white" stroke="#73929b" stroke-width="2"/><text x="354" y="121" font-family="Arial" font-size="18" font-weight="bold" fill="#143e49">Q1 / Q2 power gate</text><text x="354" y="148" font-family="Arial" font-size="14" fill="#2b505b">AO4407A + 2N7002</text><text x="354" y="170" font-family="Arial" font-size="14" fill="#2b505b">GPIO10 -&gt; EN; default OFF</text><rect x="810" y="95" width="330" height="115" rx="9" fill="white" stroke="#73929b" stroke-width="2"/><text x="824" y="121" font-family="Arial" font-size="18" font-weight="bold" fill="#143e49">2 x HV SERVOS</text><text x="824" y="148" font-family="Arial" font-size="14" fill="#2b505b">J5 / J6: 1=GND, 2=VSERVO</text><text x="824" y="170" font-family="Arial" font-size="14" fill="#2b505b">3=PWM | left / right</text><text x="824" y="192" font-family="Arial" font-size="14" fill="#2b505b">220 uF 16 V across servo rail</text><rect x="35" y="325" width="210" height="120" rx="9" fill="white" stroke="#73929b" stroke-width="2"/><text x="49" y="351" font-family="Arial" font-size="18" font-weight="bold" fill="#143e49">Mini-360 buck</text><text x="49" y="378" font-family="Arial" font-size="14" fill="#2b505b">J2-1 VIN, J2-2 GND</text><text x="49" y="400" font-family="Arial" font-size="14" fill="#2b505b">Adjust OUT to 5.0 V</text><text x="49" y="422" font-family="Arial" font-size="14" fill="#2b505b">J2-3 OUT: electronics only</text><rect x="365" y="325" width="225" height="160" rx="9" fill="white" stroke="#73929b" stroke-width="2"/><text x="379" y="351" font-family="Arial" font-size="18" font-weight="bold" fill="#143e49">XIAO ESP32-C3</text><text x="379" y="378" font-family="Arial" font-size="14" fill="#2b505b">5V via SS14; GND common</text><text x="379" y="400" font-family="Arial" font-size="14" fill="#2b505b">D1/G3 -&gt; left PWM</text><text x="379" y="422" font-family="Arial" font-size="14" fill="#2b505b">D3/G5 -&gt; right PWM</text><text x="379" y="444" font-family="Arial" font-size="14" fill="#2b505b">D10/G10 -&gt; power EN</text><text x="379" y="466" font-family="Arial" font-size="14" fill="#2b505b">D2/G4 -&gt; battery ADC</text><rect x="805" y="325" width="335" height="140" rx="9" fill="white" stroke="#73929b" stroke-width="2"/><text x="819" y="351" font-family="Arial" font-size="18" font-weight="bold" fill="#143e49">74AHCT2G125DP</text><text x="819" y="378" font-family="Arial" font-size="14" fill="#2b505b">8=5V | 4=GND | 1,7=GND</text><text x="819" y="400" font-family="Arial" font-size="14" fill="#2b505b">2=input left; 6=output left</text><text x="819" y="422" font-family="Arial" font-size="14" fill="#2b505b">5=input right; 3=output right</text><text x="819" y="444" font-family="Arial" font-size="14" fill="#2b505b">Each output -&gt; 220R -&gt; servo PWM</text><rect x="35" y="515" width="555" height="90" rx="9" fill="white" stroke="#73929b" stroke-width="2"/><text x="49" y="541" font-family="Arial" font-size="18" font-weight="bold" fill="#143e49">BATTERY ADC</text><text x="49" y="568" font-family="Arial" font-size="14" fill="#2b505b">VBAT -&gt; 100k -&gt; GPIO4 -&gt; 33k -&gt; GND</text><text x="49" y="590" font-family="Arial" font-size="14" fill="#2b505b">100nF from GPIO4 to GND; 8.4 V maps to 2.084 V</text><text x="36" y="642" font-family="Arial" font-size="15" fill="#395762">All GND points are common. Route servo return directly to battery ground with short 24AWG wire.</text><text x="36" y="667" font-family="Arial" font-size="15" fill="#395762">SS14: anode = buck 5V, cathode (stripe) = XIAO 5V. Never put 2S on XIAO BAT or 5V.</text><text x="36" y="692" font-family="Arial" font-size="15" fill="#395762">Exact transistor pin numbers / R values: hardware/schematic.pdf. No IMU, ELRS receiver or LED required.</text></svg>