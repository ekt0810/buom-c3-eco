<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52717a"/></marker></defs><rect width="1200" height="740" fill="#f5f8f8"/><text x="36" y="42" font-size="24" font-family="Arial" font-weight="bold" fill="#143e49">ESP-NOW TRANSMITTER / ESP32-WROOM-32 DevKit V1</text><polyline points="325,175 450,175" fill="none" stroke="#316b99" stroke-width="3" marker-end="url(#arrow)"/><text x="350" y="160" font-family="Arial" font-size="14" fill="#316b99">VRx / VRy</text><polyline points="325,370 450,370" fill="none" stroke="#316b99" stroke-width="3" marker-end="url(#arrow)"/><text x="350" y="360" font-family="Arial" font-size="14" fill="#316b99">Wiper</text><polyline points="915,175 780,175" fill="none" stroke="#497a58" stroke-width="3" marker-end="url(#arrow)"/><text x="810" y="160" font-family="Arial" font-size="14" fill="#497a58">GPIO25</text><polyline points="780,325 915,325" fill="none" stroke="#b56c27" stroke-width="3" marker-end="url(#arrow)"/><text x="810" y="320" font-family="Arial" font-size="14" fill="#b56c27">GPIO26</text><polyline points="780,410 845,410 845,515 915,515" fill="none" stroke="#b56c27" stroke-width="3" marker-end="url(#arrow)"/><text x="810" y="490" font-family="Arial" font-size="14" fill="#b56c27">GPIO27</text><polyline points="610,515 610,470" fill="none" stroke="#b56c27" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="500" font-family="Arial" font-size="14" fill="#b56c27">USB</text><rect x="40" y="100" width="285" height="135" rx="9" fill="white" stroke="#73929b" stroke-width="2"/><text x="54" y="126" font-family="Arial" font-size="18" font-weight="bold" fill="#143e49">Joystick XY</text><text x="54" y="153" font-family="Arial" font-size="14" fill="#2b505b">VCC=3V3, GND=GND</text><text x="54" y="175" font-family="Arial" font-size="14" fill="#2b505b">VRx -&gt; GPIO32</text><text x="54" y="197" font-family="Arial" font-size="14" fill="#2b505b">VRy -&gt; GPIO33</text><text x="54" y="219" font-family="Arial" font-size="14" fill="#2b505b">SW unused</text><rect x="40" y="315" width="285" height="125" rx="9" fill="white" stroke="#73929b" stroke-width="2"/><text x="54" y="341" font-family="Arial" font-size="18" font-weight="bold" fill="#143e49">Throttle potentiometer 10k</text><text x="54" y="368" font-family="Arial" font-size="14" fill="#2b505b">End 1=3V3, end 3=GND</text><text x="54" y="390" font-family="Arial" font-size="14" fill="#2b505b">Wiper -&gt; GPIO34</text><text x="54" y="412" font-family="Arial" font-size="14" fill="#2b505b">Non-centering knob</text><rect x="450" y="110" width="330" height="360" rx="9" fill="white" stroke="#73929b" stroke-width="2"/><text x="464" y="136" font-family="Arial" font-size="18" font-weight="bold" fill="#143e49">ESP32 DevKit V1</text><text x="464" y="163" font-family="Arial" font-size="14" fill="#2b505b">GPIO32: roll ADC1</text><text x="464" y="185" font-family="Arial" font-size="14" fill="#2b505b">GPIO33: pitch ADC1</text><text x="464" y="207" font-family="Arial" font-size="14" fill="#2b505b">GPIO34: throttle ADC1</text><text x="464" y="229" font-family="Arial" font-size="14" fill="#2b505b">GPIO25: ARM, INPUT_PULLUP</text><text x="464" y="251" font-family="Arial" font-size="14" fill="#2b505b">GPIO26: status LED</text><text x="464" y="273" font-family="Arial" font-size="14" fill="#2b505b">GPIO27: passive piezo</text><text x="464" y="295" font-family="Arial" font-size="14" fill="#2b505b">USB 5V: power bank</text><text x="464" y="317" font-family="Arial" font-size="14" fill="#2b505b">ADC inputs must stay &lt;=3.3V</text><rect x="915" y="100" width="245" height="110" rx="9" fill="white" stroke="#73929b" stroke-width="2"/><text x="929" y="126" font-family="Arial" font-size="18" font-weight="bold" fill="#143e49">ARM switch</text><text x="929" y="153" font-family="Arial" font-size="14" fill="#2b505b">GPIO25 -&gt; switch -&gt; GND</text><text x="929" y="175" font-family="Arial" font-size="14" fill="#2b505b">OPEN = DISARM</text><rect x="915" y="295" width="245" height="100" rx="9" fill="white" stroke="#73929b" stroke-width="2"/><text x="929" y="321" font-family="Arial" font-size="18" font-weight="bold" fill="#143e49">Status LED</text><text x="929" y="348" font-family="Arial" font-size="14" fill="#2b505b">GPIO26 -&gt; 1k -&gt; anode</text><text x="929" y="370" font-family="Arial" font-size="14" fill="#2b505b">Cathode -&gt; GND</text><rect x="915" y="475" width="245" height="100" rx="9" fill="white" stroke="#73929b" stroke-width="2"/><text x="929" y="501" font-family="Arial" font-size="18" font-weight="bold" fill="#143e49">Passive piezo</text><text x="929" y="528" font-family="Arial" font-size="14" fill="#2b505b">GPIO27 -&gt; 1k -&gt; piezo</text><text x="929" y="550" font-family="Arial" font-size="14" fill="#2b505b">Other terminal -&gt; GND</text><rect x="450" y="515" width="330" height="70" rx="9" fill="white" stroke="#73929b" stroke-width="2"/><text x="464" y="541" font-family="Arial" font-size="18" font-weight="bold" fill="#143e49">USB 5V power bank</text><text x="464" y="568" font-family="Arial" font-size="14" fill="#2b505b">Verify it does not auto-shut off</text><text x="36" y="642" font-family="Arial" font-size="15" fill="#395762">Transmit at 50 Hz. Pair MAC addresses and the same 16-character PMK/LMK on both units.</text><text x="36" y="667" font-family="Arial" font-size="15" fill="#395762">Use ESP32-WROOM-32 for this pinout. Do not substitute an ESP32-C3 DevKit without remapping.</text><text x="36" y="692" font-family="Arial" font-size="15" fill="#395762">First calibrate joystick center/endpoints and throttle minimum from Serial Monitor (115200).</text></svg>